name: run bot

on:
  schedule:
    # Safety net only. GitHub drops or delays scheduled runs (here it fired once in several hours),
    # so the bot chains itself: each run queues the next one at its last step. If the chain ever
    # breaks, the next scheduled run that does fire starts it again. Odd minutes: the top of the
    # hour and the half hour are when GitHub is busiest.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      cycle_minutes:
        description: Minutes from the start of this run to the start of the next one
        default: "30"

# Two overlapping runs would read the same posts: the next one waits.
concurrency:
  group: run-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # Off until the repository variable BOT_ENABLED is "true" (Settings → Secrets and variables → Actions).
    # Setting it to anything else, or cancelling a run, also ends the chain.
    if: vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # to queue the next run (workflow_dispatch made with the job's own token is allowed)
      actions: write
    steps:
      - name: Remember when this run started
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the browser
        run: npx playwright install --with-deps chromium
        if: steps.browser.outputs.cache-hit != 'true'
        # A hung download once held the whole job until its 40-minute limit, which cancelled it
        # and ended the chain. A stuck step now fails on its own and the chain goes on.
        timeout-minutes: 8

      - name: Install the browser's system libraries
        run: npx playwright install-deps chromium
        if: steps.browser.outputs.cache-hit == 'true'
        timeout-minutes: 8

      # The posts already decided survive between runs in the Actions cache until the bot gets
      # its Supabase table. A new key each run, restored from the latest one.
      - name: Restore seen posts
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: seen-posts.json
          key: seen-v2-${{ github.run_id }}
          restore-keys: seen-v2-

      - name: Run
        run: npm start
        env:
          TARGET_URL: ${{ vars.TARGET_URL }}
          BOT_INGEST_SECRET: ${{ secrets.BOT_INGEST_SECRET }}
          # Optional repository variables; empty means the default (see src/policy.ts).
          BOT_MAX_AGE_MINUTES: ${{ vars.BOT_MAX_AGE_MINUTES }}
          BOT_GAP_SECONDS: ${{ vars.BOT_GAP_SECONDS }}

      - name: Save seen posts
        if: always() && hashFiles('seen-posts.json') != ''
        uses: actions/cache/save@v4
        with:
          path: seen-posts.json
          key: seen-v2-${{ github.run_id }}

      # Keeps the Actions list short: finished runs older than six hours are deleted. Not worth
      # failing the run for, so a problem here is only a warning.
      - name: Delete old runs
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d "6 hours ago" +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=completed&per_page=100"  --jq ".workflow_runs[] | select(.created_at < \"$cutoff\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" --silent && echo "Deleted run $id"
            done

      # The chain. It runs after a failed run too (a broken source must not stop the bot) but not
      # after a cancelled one: cancelling is how to stop it.
      - name: Queue the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          # A manual run can set it for itself; the chained ones use the repository variable.
          CYCLE_MINUTES: ${{ inputs.cycle_minutes || vars.BOT_CYCLE_MINUTES || '30' }}
        run: |
          wait=$(( CYCLE_MINUTES * 60 - ( $(date +%s) - RUN_STARTED ) ))
          if [ "$wait" -gt 0 ]; then
            echo "Waiting ${wait}s to start the next run ${CYCLE_MINUTES} minutes after this one began."
            sleep "$wait"
          fi
          # Another run already waiting (the safety-net schedule, or a manual one) is the next run.
          waiting=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow run.yml --limit 20 \
            --json databaseId,status \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.status == \"queued\" or .status == \"waiting\" or .status == \"pending\"))] | length")
          if [ "$waiting" -gt 0 ]; then
            echo "A run is already waiting: not queueing another."
          else
            gh workflow run run.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
            echo "Queued the next run."
          fi
